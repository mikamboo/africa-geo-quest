name: Fait erroné ou carte
description: Une information, une capitale, une frontière ou un tracé à corriger.
labels: ['triage:new', 'type:fait-errone']
body:
  - type: textarea
    id: details
    attributes:
      label: Qu'est-ce qui est faux ?
      description: Ce que le jeu affiche, et ce qui serait juste.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source fiable
      description: Lien vers une source sérieuse (encyclopédie, site officiel, ONU…). Obligatoire pour corriger un fait.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Les champs « Contexte » sont remplis par le bouton « Signaler » du jeu. Laisse-les tels quels, ou vides si tu écris depuis GitHub.
        **Ne mets aucune donnée personnelle** (nom, âge, école, adresse, photo). Si tu as moins de 13 ans, demande à un adulte de publier pour toi.
  - type: input
    id: category
    attributes:
      label: 'Contexte : catégorie'
  - type: input
    id: country
    attributes:
      label: 'Contexte : pays (code ISO A3)'
  - type: input
    id: question
    attributes:
      label: 'Contexte : question du quiz'
  - type: input
    id: screen
    attributes:
      label: 'Contexte : écran'
  - type: input
    id: locale
    attributes:
      label: 'Contexte : langue'
  - type: input
    id: level
    attributes:
      label: 'Contexte : niveau'
  - type: input
    id: version
    attributes:
      label: 'Contexte : version du jeu'

  - type: checkboxes
    id: privacy
    attributes:
      label: Données personnelles
      options:
        - label: Ce signalement ne contient aucune donnée personnelle.
          required: true
